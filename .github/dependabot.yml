version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-patches:
        patterns:
          - "*"
        update-types:
          - patch
    ignore:
      # Major upgrades are release projects, not unattended maintenance. Security
      # alerts remain visible and can be handled in a dedicated reviewed change.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Stripe minor releases can change the SDK's compile-time API version.
      # Review these separately with webhook and payment acceptance tests.
      - dependency-name: stripe
        update-types:
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
