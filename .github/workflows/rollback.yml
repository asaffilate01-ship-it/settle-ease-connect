name: Protected rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to roll back
        required: true
        type: choice
        options: [staging, production]
        default: staging
      version_id:
        description: Cloudflare Worker version ID to restore
        required: true
        type: string
      reason:
        description: Incident/change record explaining the rollback
        required: true
        type: string
      confirmation:
        description: Enter ROLLBACK staging or ROLLBACK production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Confirm intentional rollback
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          VERSION_ID: ${{ inputs.version_id }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ "$CONFIRMATION" != "ROLLBACK $TARGET_ENVIRONMENT" ]; then
            echo "Rollback confirmation must exactly match: ROLLBACK $TARGET_ENVIRONMENT" >&2
            exit 1
          fi
          if ! printf '%s' "$VERSION_ID" | grep -Eq '^[A-Za-z0-9-]{8,128}$'; then
            echo "version_id has an invalid format." >&2
            exit 1
          fi
          if ! printf '%s' "$CLOUDFLARE_WORKER_NAME" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'; then
            echo "CLOUDFLARE_WORKER_NAME is missing or invalid." >&2
            exit 1
          fi
          if [ "${#REASON}" -lt 12 ]; then
            echo "A meaningful rollback reason of at least 12 characters is required." >&2
            exit 1
          fi

      - name: Install locked deployment tooling
        run: npm ci

      - name: Build deployment configuration
        run: npm run build

      - name: Restore reviewed Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          VERSION_ID: ${{ inputs.version_id }}
          REASON: ${{ inputs.reason }}
        run: >-
          npm run rollback -- "$VERSION_ID"
          --name "$CLOUDFLARE_WORKER_NAME"
          --message "$REASON"
          --yes

      - name: Verify restored deployment
        env:
          APP_URL: ${{ vars.APP_URL }}
          APP_VERSION: ${{ vars.ROLLBACK_APP_VERSION }}
          READINESS_TOKEN: ${{ secrets.READINESS_TOKEN }}
          NATIVE_TARGETS: none
        run: npm run release:verify-deployment
