name: Authenticated staging acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Member and workforce journeys
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    env:
      STAGING_URL: ${{ vars.APP_URL }}
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      E2E_AGENT_EMAIL: ${{ secrets.E2E_AGENT_EMAIL }}
      E2E_AGENT_PASSWORD: ${{ secrets.E2E_AGENT_PASSWORD }}
      E2E_EXPERT_EMAIL: ${{ secrets.E2E_EXPERT_EMAIL }}
      E2E_EXPERT_PASSWORD: ${{ secrets.E2E_EXPERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-project
      - run: npx playwright install --with-deps chromium
      - name: Run authenticated desktop and mobile journeys
        run: npm run test:e2e:staging
      - name: Create non-sensitive acceptance evidence
        run: node scripts/write-staging-acceptance-evidence.mjs
      - name: Preserve acceptance evidence
        uses: actions/upload-artifact@v7
        with:
          name: staging-acceptance-evidence-${{ github.sha }}
          path: release/staging-acceptance.evidence.json
          if-no-files-found: error
          retention-days: 365
